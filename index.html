<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Course / Exam Selector */
        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        /* Ad Banner */
        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Quiz Box */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        /* PDF Unlock Section */
        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <!-- Exam Selector -->
    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="geography_final">🌍 Geography of Ethiopia (Final Exam)</option>
            <option value="geography_mid">🗺️ Geography of Ethiopia (Mid Exam)</option>
            <option value="logic_mid">💡 Logic & Critical Thinking (Mid Exam)</option>
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
            <option value="econ_final">🎓 Economics (Final Exam)</option>
        </select>
    </div>

    <!-- Watch Ad Banner -->
    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <!-- Quiz Card -->
    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">🌍 Geography Final Exam Practice</h3>
            <span class="progress-text" id="quizProgress">1 / 18</span>
        </div>

        <div class="question-box" id="qText">Loading question...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <!-- Unlock PDF -->
    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Coins state
        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        // Comprehensive Question Banks
        const examData = {
            geography_final: [
                {
                    q: "1. Ethiopia's wildlife resource is characterized by high level of uniqueness and endemicity.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! ኢትዮጵያ በተለያዩ የመልክዓ ምድር ከፍታዎች ሳቢያ በርካታ በሀገሪቱ ብቻ የሚገኙ (Endemic) ብርቅዬ የዱር እንስሳት አሏት።"
                },
                {
                    q: "2. The earth surface is the main source of heat for the lower atmosphere that transfers in the form of long-wave radiation and convection.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! የከባቢ አየር የታችኛው ክፍል ሙቀት የሚያገኘው ከመሬት ገጽ በሚወጣው ረጅም ሞገድ ጨረር (Terrestrial long-wave radiation) ነው።"
                },
                {
                    q: "3. Despite their origin from highland areas, rivers in Ethiopia have immense navigation potential.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! የኢትዮጵያ ወንዞች ተራራማና ፏፏቴ የበዛባቸው (Rapids & Cataracts) በመሆናቸው ለትራንስፖርት (Navigation) አያገለግሉም (ከባሮ ወንዝ በስተቀር)።"
                },
                {
                    q: "4. In Ethiopia, the variation in the amount of solar radiation received daily is small throughout the year.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! ኢትዮጵያ ለምድር ወገብ (Equator) ቅርብ በመሆኗ ዓመቱን ሙሉ የምታገኘው የፀሐይ ብርሃን ልዩነት በጣም አነስተኛ ነው።"
                },
                {
                    q: "5. In the tropical region, the annual range of temperature is very low due to high change in angle of sun in winter and summer.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! በሞቃታማ ክልሎች ዓመታዊ የሙቀት ልዩነት አነስተኛ የሆነው የፀሐይ ማዕዘን ለውጥ አነስተኛ (Low change in sun angle) በመሆኑ እንጂ ከፍተኛ በመሆኑ አይደለም።"
                },
                {
                    q: "6. The peripheries of Ethiopia experience tropical temperature conditions and mean maximum temperatures.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! የኢትዮጵያ ድንበር አዋሳኝ ቆላማ አካባቢዎች (Peripheries) ከፍተኛ የሆነ አመታዊ የሙቀት መጠን ያስመዘግባሉ።"
                },
                {
                    q: "7. Why do most parts of Ethiopia receive little or no rainfall during the winter season (Bega)?",
                    options: [
                        "A) Winds carry moisture from Atlantic Ocean",
                        "B) Winds dominating during winter are of continental origin (Northeast Trade Winds)",
                        "C) Position of ITCZ shifts towards North of Ethiopia",
                        "D) Position of ITCZ shifts towards South making Westerlies energetic"
                    ],
                    correct: 1,
                    exp: "ትክክል! በበጋ ወቅት በኢትዮጵያ ላይ የሚነፍሱት የሰሜን ምሥራቅ ንፋሶች ከደረቅ የመሬት ክፍል (Continental origin) ስለሚነሱ ዝናብ አልባ ናቸው።"
                },
                {
                    q: "8. Identify the WRONG combination of wildlife and its habitat:",
                    options: [
                        "A) Walia Ibex -> Semien highlands",
                        "B) Hippopotamus -> Bale Mountains",
                        "C) Semien Fox -> Bale and Semien highlands",
                        "D) Flamingos -> Abijata-Shalla national park"
                    ],
                    correct: 1,
                    exp: "ትክክል! ጉማሬ (Hippopotamus) የውሃና የሐይቅ ዳርቻ እንስሳ እንጂ የባሌ ተራሮች መገለጫ አይደለም።"
                },
                {
                    q: "9. Which one of the following is TRUE about Ethiopian rivers?",
                    options: [
                        "A) While Atbara is to Mereb, Juba is to Wabishebelle",
                        "B) Most Ethiopian rivers never manifest variation in water quantity",
                        "C) From SE drainage, Ghenale is the largest in catchment area",
                        "D) One of the functions of Ethiopian rivers is that they serve as physical boundaries"
                    ],
                    correct: 3,
                    exp: "ትክክል! የኢትዮጵያ ወንዞች በክልሎችና በሀገራት መካከል እንደ ተፈጥሯዊ ወሰን (Physical boundary) ሆነው ያገለግላሉ።"
                },
                {
                    q: "10. The following statements are correct about controls of weather and climate EXCEPT:",
                    options: [
                        "A) Higher latitude areas receive high temperature",
                        "B) Lower latitude areas receive high temperature",
                        "C) Inclination of earth's axis produces changes in directness of sun rays",
                        "D) Inclination of earth's axis determines temperature zones"
                    ],
                    correct: 0,
                    exp: "ትክክል! ከፍተኛ ላቲቲዩድ (Higher latitude / ወገብ የራቁ ቦታዎች) ቅዝቃዜ እንጂ ከፍተኛ ሙቀት አይቀበሉም።"
                },
                {
                    q: "11. Which traditional climate zone of Ethiopia is dominated by Acacia vegetation?",
                    options: ["A) Woina Dega", "B) Dega", "C) Bereha / Kolla", "D) Wurch"],
                    correct: 2,
                    exp: "ትክክል! የግራር (Acacia) ዛፎች በቆላ እና በበረሃ (Kolla/Bereha) ክልሎች በስፋት ይገኛሉ።"
                },
                {
                    q: "12. In summer, Ethiopia experiences lower temperatures contrary to high solar insolation due to:",
                    options: [
                        "A) Latitude and global air pressure",
                        "B) Altitude and ocean current",
                        "C) Latitude and distance from the sea",
                        "D) Altitude and cloud cover"
                    ],
                    correct: 3,
                    exp: "ትክክል! በክረምት ወቅት ያለው ከፍተኛ የከፍታ መጠን (Altitude) እና የደመና መሸፈን (Cloud cover) ሙቀቱን ይቀንሰዋል።"
                },
                {
                    q: "13. Public transportation and energy efficient technologies to reduce greenhouse gas emissions is categorized as:",
                    options: ["A) Adaptation", "B) Mitigation", "C) Resilience", "D) Modification"],
                    correct: 1,
                    exp: "ትክክል! የበካይ ጋዞችን ልቀት መቀነስ የአየር ንብረት ለውጥን የማቃለል (Mitigation) ስልት ነው።"
                },
                {
                    q: "14. Which man-made lake is CORRECTLY matched with its river?",
                    options: [
                        "A) Koka -> Fincha river",
                        "B) Melka Wakena -> Wabishebelle river",
                        "C) Abasamuel -> Abay river",
                        "D) Fincha -> Awash river"
                    ],
                    correct: 1,
                    exp: "ትክክል! የመልካ ዋከና ሰው ሰራሽ ሐይቅ የተሰራው በዋቢ ሸበሌ (Wabishebelle River) ላይ ነው።"
                },
                {
                    q: "15. Which of the following is a dominant plant species found in the Afro-alpine (Wurch) region?",
                    options: [
                        "A) Lobelia rhynchopetalum (Giberra)",
                        "B) Hagenia Abyssinica (Kosso)",
                        "C) Ficus sur (Sholla)",
                        "D) Olea africana (Weyra)"
                    ],
                    correct: 0,
                    exp: "ትክክል! ግበራ (Lobelia rhynchopetalum) እጅግ ከፍተኛ በሆኑ የቁር (Afro-alpine) አካባቢዎች ብቻ የሚበቅል ተክል ነው።"
                },
                {
                    q: "16. Which altitudinal range has relatively short growing seasons?",
                    options: [
                        "A) 1600-2000 m a.s.l",
                        "B) 500-1500 m a.s.l",
                        "C) 2400-3000 m a.s.l",
                        "D) Above 3300 m a.s.l"
                    ],
                    correct: 3,
                    exp: "ትክክል! ከ 3300 ሜትር በላይ ባሉ በጣም ቀዝቃዛ ቦታዎች የዕፅዋት እድገት ጊዜ (Growing season) እጅግ አጭር ነው።"
                },
                {
                    q: "17. The spatial variation of temperature in Ethiopia is significantly determined by:",
                    options: ["A) Latitude", "B) Distance from water bodies", "C) Vegetation cover", "D) Altitude"],
                    correct: 3,
                    exp: "ትክክል! በኢትዮጵያ የቦታዎች የሙቀት ልዩነት በዋናነት የሚወሰነው በመሬት ከፍታ (Altitude) ነው።"
                }
            ],
            geography_mid: [
                {
                    q: "1. The Gneissic high lands of Konso and the surrounding high lands separate the main Ethiopian rift from the Afar triangle.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! የኮንሶ ከፍተኛ ቦታዎች ዋናውን የኢትዮጵያ ስምጥ ሸለቆ ከ Chew Bahir ስምጥ ሸለቆ እንጂ ከአፋር ትሪያንግል አይለዩትም።"
                },
                {
                    q: "2. The Shewan Plateau has the largest proportion of elevated ground from the Western highlands physiographic subdivision.",
                    options: ["A) True", "B) False"],
                    correct: 0,

        let currentExam = 'geography_final';
        let currentQIndex = 0;
        let isAnswered = false;

        function switchExam(type) {
            currentExam = type;
            currentQIndex = 0;
            const titles = {
                geography_final: "🌍 Geography Final Exam Practice",
                geography_mid: "🗺️ Geography Mid Exam Practice",
                logic_mid: "💡 Logic Mid Exam Practice",
                logic_final: "💡 Logic Final Exam Practice",
                econ_mid: "📝 Economics Mid Exam Practice",
                econ_final: "🎓 Economics Final Exam Practice"
            };
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        let adController = null;
        function watchAdForCoins() {
            try {
                if (!adController) {
                    adController = window.Adsgram.init({ blockId: "int-44327" });
                }
                adController.show().then(() => {
                    updateCoins(50);
                    alert("🎉 50 Coins በተሳካ ሁኔታ ተጨምሮልዎታል!");
                }).catch(() => {
                    // Fallback for preview mode
                    updateCoins(50);
                    alert("🎉 (Preview Mode) 50 Coins ተጨምሯል!");
                });
            } catch (e) {
                updateCoins(50);
                alert("🎉 50 Coins ተጨምሯል!");
            }
        }

            const fileMap = {

                    tg.openTelegramLink("https://t.me/Bahirabbot?start=" + fileKey);
                    setTimeout(() => { tg.close(); }, 800);
                } else {
                    window.location.href = "https://t.me/Bahirabbot?start=" + fileKey;
                }
            } else {
                alert("⚠️ በቂ Coins የለዎትም! ማስታወቂያ በማየት ወይም ጥያቄዎችን በመስራት Coins ይሰብስቡ።");

        }
