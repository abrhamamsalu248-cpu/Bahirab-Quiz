<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="history_mid">📜 History of Ethiopia and the Horn (Mid Exam)</option>
            <option value="history_final">📜 History of Ethiopia and the Horn (Final Exam)</option>
            <option value="geography_final">🌍 Geography of Ethiopia (Final Exam)</option>
            <option value="geography_mid">🗺️ Geography of Ethiopia (Mid Exam)</option>
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="logic_mid">💡 Logic & Critical Thinking (Mid Exam)</option>
            <option value="econ_final">🎓 Economics (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
        </select>
    </div>

    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">📜 History Mid Exam Practice</h3>
            <span class="progress-text" id="quizProgress">1 / 22</span>
        </div>

        <div class="question-box" id="qText">Loading question...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        const examData = {
            history_mid: [
                {
                    q: "1. Knowledge of history is indispensable to understand who we are and where we fit in the world.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ታሪክ ማንነታችንን ለመረዳት እና በአለም ውስጥ ያለንን ቦታ ለማወቅ መሰረታዊ እውቀት ነው።"
                },
                {
                    q: "2. The organized study and narration of the past was introduced by ancient Greek historian called Leopold Von Ranke.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ታሪክን እንደ ሳይንሳዊ ትምህርት ያደራጀው ሊዮፖልድ ቮን ራንኬ የጀርመን (Modern Germany) እንጂ የጥንቷ ግሪክ የታሪክ አባት (Herodotus) አይደለም።"
                },
                {
                    q: "3. The geographic limit of Ethiopia and the Horn includes Ethiopia, Sudan, Eritrea, Djibouti and Somalia.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ሱዳን የአፍሪካ ቀንድ (Horn of Africa) አካል ተደርጋ አትቆጠርም።"
                },
                {
                    q: "4. Oral information we get from an eyewitness of a person on an incident is primary source whatever the subjectivity of the informant.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ክስተቱን በዓይኑ ያየ ሰው የሚሰጠው የቃል መረጃ ቀዳሚ የታሪክ ምንጭ (Primary Source) ነው።"
                },
                {
                    q: "5. The earliest known reference that we have on the history of Ethiopia and the Horn is the Periplus of the Erythrean Sea written in the first century A.D.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ፔሪፕለስ ኦፍ ዘ ኤሪትሪያን ሲ በመጀመሪያው መቶ ክፍለ ዘመን የተጻፈ ጥንታዊ የጽሑፍ ምንጭ ነው።"
                },
                {
                    q: "6. The abuse of history is emanated from lack of sources and the intentional aim of the writers to discard past actions.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: የታሪክ መዛባት ከምንጮች እጥረት እና ሆን ተብሎ ከሚደረግ የታሪክ ማዛባት የመነጨ ነው።"
                },
                {
                    q: "7. The history of non-literate societies had been written based on oral sources.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: የጽሑፍ ባህል ባልነበራቸው ማህበረሰቦች ታሪካቸው የተመዘገበው በአፈ-ታሪክ (Oral tradition) ነው።"
                },
                {
                    q: "8. Yeha as a cultural center was established due to the commercial involvement of South-Arabian merchants in the Horn of Africa.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ይሐ ከደቡብ ዓረብ ነጋዴዎች ጋር በነበረው የንግድና የባህል ትስስር ማዕከል ሆና ተመስርታለች።"
                },
                {
                    q: "9. Which one of the following alternative is different from the other (Secondary Source)?",
                    options: ["A) Coin", "B) Book", "C) Letter", "D) Minute"],
                    correct: 1,
                    exp: "B: መጽሐፍ (Book) ሁለተኛ ደረጃ የታሪክ ምንጭ (Secondary Source) ሲሆን ሌሎቹ ቀዳሚ (Primary) ናቸው።"
                },
                {
                    q: "10. Identify the wrong statement about the Zagwe Dynasty?",
                    options: [
                        "A) The Zagwe maintained the ancient Aksumite traditions intact",
                        "B) Merra Tekle Haimanot was the last king of Zagwe Dynasty whose throne was overthrown by Yekuno-Amlak",
                        "C) The Zagwe period was a golden age in Ethiopia's paintings and translation of religious works",
                        "D) Export items included slaves, ivory and rare spices"
                    ],
                    correct: 1,
                    exp: "B: ሜራ ተክለሃይማኖት የዛጔ ስርወ-መንግስት መስራች እንጂ የመጨረሻው ንጉሥ (Yetbarak) አልነበረም።"
                },
                {
                    q: "11. The decline of Axumite State in the 7th Century A.D is attributed to the following events except:",
                    options: [
                        "A) The perpetuation of lucrative trade with the external world",
                        "B) Environmental degradation and decline in agricultural productivity",
                        "C) Isolation of the Aksum state from its old commercial partners by Muslim Arabs",
                        "D) The destruction of the port of Adulis and economic decline"
                    ],
                    correct: 0,
                    exp: "A: የአክሱም ውድቀት ከዓለም አቀፍ ንግድ መቋረጥ ጋር የተያያዘ እንጂ የንግዱ መቀጠል አልነበረም።"
                },
                {
                    q: "12. Identify the incorrect statement about religion and religious processes in Ethiopia and the Horn?",
                    options: [
                        "A) Unlike Catholicism, Orthodox Christianity is Monophysite in explaining the nature of Christ",
                        "B) Christianity and Islam are both monotheistic religions introduced from abroad in the 4th and 7th Centuries A.D",
                        "C) The introduction of Judaism to the Horn is apparent compared to Christianity and Islam",
                        "D) The practices and beliefs of indigenous religion are fused with Christianity and Islam"
                    ],
                    correct: 0,
                    exp: "A: የኢትዮጵያ ኦርቶዶክስ ተዋሕዶ እምነት ተዋሕዶ (Mia-physite) እንጂ Monophysite አትባልም።"
                },
                {
                    q: "13. Who introduced monastic life to the Christian of ancient Ethiopia?",
                    options: ["A) Nine saints", "B) Fremnatous", "C) Atnatewos", "D) Ezana"],
                    correct: 0,
                    exp: "A: ተስዓቱ ቅዱሳን (Nine Saints) በ 5ኛው ክፍለ ዘመን ምንኩስናንና ገዳማዊ ህይወትን አስተዋውቀዋል።"
                },
                {
                    q: "14. Which one of the following is correct in chronological order from ancient to recent in human evolution timeline?",
                    options: [
                        "A) Homo sapiens -> Homo habilis -> Homo erectus",
                        "B) Homo erectus -> Homo sapiens -> Homo habilis",
                        "C) Homo habilis -> Homo erectus -> Homo sapiens",
                        "D) Homo habilis -> Homo sapiens -> Homo erectus"
                    ],
                    correct: 2,
                    exp: "C: ትክክለኛው የሰው ዘር የዝግመተ ለውጥ ቅደም ተከተል Habilis -> Erectus -> Sapiens ነው።"
                },
                {
                    q: "15. Identify the wrong statement about history?",
                    options: [
                        "A) History is the basis for the study of politics and philosophy",
                        "B) Cause and effect relationship between past and present is lively presented",
                        "C) History is an inquiry in the present based on evidences",
                        "D) History enables us to study changes and continuity that are taking place over time"
                    ],
                    correct: 2,
                    exp: "C: ታሪክ ያለፈውን (Past) መመርመር እንጂ የአሁኑን ጊዜ ብቻ መመርመር አይደለም።"
                },
                {
                    q: "16. Which of the following is NOT among the uses of history?",
                    options: [
                        "A) Promote diversity that provides opportunities for succession",
                        "B) Develop sense of tolerance and open mindedness",
                        "C) Enables to understand the surrounding environment",
                        "D) Enables to understand the past and correct past mistake"
                    ],
                    correct: 0,
                    exp: "A: ታሪክ ለመገንጠልና ለልዩነት ማራመጃነት አያገለግልም።"
                },
                {
                    q: "17. Which of the following statements best describe primary sources?",
                    options: [
                        "A) They are interpreted from secondary sources",
                        "B) Have no direct relation to the event they are describing",
                        "C) They are original and nearer to the event both in time and space",
                        "D) They are free from critical examination by historians"
                    ],
                    correct: 2,
                    exp: "C: የመጀመሪያ ደረጃ ምንጮች ለክስተቱ በጊዜና በቦታ እጅግ የቀረቡ ኦሪጅናል መረጃዎች ናቸው።"
                },
                {
                    q: "18. Which of the following was the factor for the downfall of Zagwe dynasty in 1270 AD?",
                    options: [
                        "A) Power succession among the ruling family and opposition against the dynasty",
                        "B) Foreign invasion from the Arab world to control the lucrative ports",
                        "C) The prevalence of natural problems mainly drought and environmental pollution",
                        "D) The outbreak of religious problems among orthodox and Catholics"
                    ],
                    correct: 0,
                    exp: "A: በስርወ-መንግስቱ ቤተሰቦች መካከል የነበረው የስልጣን ሽኩቻና ተቃውሞ ለውድቀቱ ዋነኛ ምክንያት ነበር።"
                },
                {
                    q: "19. Why king Lalibela had constructed the Rock-hewn churches in Ethiopia?",
                    options: [
                        "A) To show the glory and majesty of the king",
                        "B) To establish second Jerusalem to solve the difficulties on pilgrims to the Holy land",
                        "C) To take the position of Egyptian Coptic church to consecrate Abuns",
                        "D) The need to restore Judaism over Christianity"
                    ],
                    correct: 1,
                    exp: "B: ወደ እየሩሳሌም የሚደረገውን አስቸጋሪና አደገኛ ጉዞ ለማስቀረት ሁለተኛዋን እየሩሳሌም በሀገሩ ለመገንባት ነው።"
                },
                {
                    q: "20. One of the following was not a historical development that took place during the Neolithic Revolution?",
                    options: [
                        "A) Domestication of plants and animals",
                        "B) Development of language and shelter in caves",
                        "C) Transformation from mobile to sedentary life",
                        "D) Production of crops"
                    ],
                    correct: 1,
                    exp: "B: በዋሻ ውስጥ መኖር የ Paleolithic (የቀድሞው ድንጋይ ዘመን) መገለጫ እንጂ የኒዮሊቲክ አይደለም።"
                },
                {

                logic_mid: "💡 Logic Mid Exam Practice",
                econ_final: "🎓 Economics Final Exam Practice",
                econ_mid: "📝 Economics Mid Exam Practice"
            };
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        let adController = null;
        function watchAdForCoins() {
            try {
                if (!adController) {
                    adController = window.Adsgram.init({ blockId: "int-44327" });
                }
                adController.show().then(() => {
                    updateCoins(50);
                    alert("🎉 50 Coins በተሳካ ሁኔታ ተጨምሮልዎታል!");
                }).catch(() => {
                    updateCoins(50);
                    alert("🎉 (Preview Mode) 50 Coins ተጨምሯል!");
                });
            } catch (e) {
                updateCoins(50);
                alert("🎉 50 Coins ተጨምሯል!");
            }
        }

        function unlockExamPDF() {
            const fileMap = {
                history_mid: 'history_mid_2016',
                history_final: 'history_final_2016',
                geography_final: 'geography_final_2017',
                geography_mid: 'geography_mid_2016',
                logic_final: 'logic_final',
                logic_mid: 'logic_mid_2016',
                econ_final: 'econ_final_2016',
                econ_mid: 'econ_mid_2016'
            };
            const fileKey = fileMap[currentExam];
            if (userCoins >= 100) {
                updateCoins(-100);
                alert("🔓 ተከፍቷል! ወደ ቴሌግራም ቦት እየወሰደዎት ነው...");
                if (tg && tg.initData) {
                    tg.openTelegramLink("https://t.me/Bahirabbot?start=" + fileKey);
                    setTimeout(() => { tg.close(); }, 800);
                } else {
                    window.location.href = "https://t.me/Bahirabbot?start=" + fileKey;
                }
            } else {
                alert("⚠️ በቂ Coins የለዎትም! ማስታወቂያ በማየት ወይም ጥያቄዎችን በመስራት Coins ይሰብስቡ።");
            }
        }

        let currentLang = 'am';
        function toggleLang() {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            if (currentLang === 'en') {
                document.getElementById('lblSelect').innerText = "📚 Select Exam:";
                document.getElementById('adTitle').innerText = "⭐ Need Free Coins?";
                document.getElementById('adSub').innerText = "Watch a quick ad to get +50 Coins.";
                document.getElementById('adBtn').innerText = "⭐ Watch Ad";
                document.getElementById('unTitle').innerText = "📥 Need full solved Exam PDF?";
                document.getElementById('unSub').innerText = "Unlock full exam paper for 100 Coins.";
                document.getElementById('unBtn').innerText = "🔓 Unlock in Telegram (100 Coins)";
                document.getElementById('nextBtn').innerText = "Next Question ➡️";
            } else {
                document.getElementById('lblSelect').innerText = "📚 የፈተና ዓይነት ይምረጡ (Select Exam):";
                document.getElementById('adTitle').innerText = "⭐ ነፃ Coins ይፈልጋሉ?";
                document.getElementById('adSub').innerText = "አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።";
                document.getElementById('adBtn').innerText = "⭐ ማስታወቂያ እይ";
                document.getElementById('unTitle').innerText = "📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?";
                document.getElementById('unSub').innerText = "የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።";
                document.getElementById('unBtn').innerText = "🔓 በ 100 Coins በቴሌግራም አውርድ";
                document.getElementById('nextBtn').innerText = "ቀጣይ ጥያቄ ➡️";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
