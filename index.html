<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="global_final">🌐 Global Trends (Final Exam)</option>
            <option value="global_mid">🌐 Global Trends (Mid Exam)</option>
            <option value="emerging_final">🤖 Emerging Technologies (Final Exam)</option>
            <option value="emerging_mid">🤖 Emerging Technologies (Mid Exam)</option>
            <option value="history_mid">📜 History of Ethiopia (Mid Exam)</option>
            <option value="history_final">📜 History of Ethiopia (Final Exam)</option>
            <option value="geography_final">🌍 Geography of Ethiopia (Final Exam)</option>
            <option value="geography_mid">🗺️ Geography of Ethiopia (Mid Exam)</option>
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="logic_mid">💡 Logic & Critical Thinking (Mid Exam)</option>
            <option value="econ_final">🎓 Economics (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
        </select>
    </div>

    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">🌐 Global Trends Final Exam Practice</h3>
            <span class="progress-text" id="quizProgress">1 / 21</span>
        </div>

        <div class="question-box" id="qText">Loading question...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        const examData = {
            global_final: [
                {
                    q: "1. National interest and foreign policy refers to the same thing, and both can be used interchangeably.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ብሔራዊ ጥቅም (National Interest) የሚፈለገው ግብ ሲሆን የውጭ ፖሊሲ (Foreign Policy) ደግሞ ግቡን ለማሳካት የምንጠቀምበት ስልት/መሳሪያ ነው።"
                },
                {
                    q: "2. The phrase the 'stick and carrot' in the literature of foreign policy refers to rewards and punishments respectively.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: Stick ማለት ቅጣት (Punishment) ሲሆን Carrot ማለት ሽልማት (Reward) ነው፤ በቅደም ተከተል 'Punishment and Reward' ተብሎ መገለጽ ነበረበት።"
                },
                {
                    q: "3. Political economy as a field of study is mainly concerned with the disputable nature of state-market relations.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: የፖለቲካ ኢኮኖሚ (Political Economy) በመንግስት እና በገበያ መካከል ያለውን ግንኙነትና መስተጋብር የሚያጠና መስክ ነው።"
                },
                {
                    q: "4. The success of a state to defend its national interest depends largely on its relative power.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: አንድ ሀገር ጥቅሟን ለማስጠበቅ ያላት አቅም ከሌሎች አገሮች አንጻር ባላት አንጻራዊ ኃይል (Relative Power) ላይ የተመሰረተ ነው።"
                },
                {
                    q: "5. States, in achieving their middle range objectives, normally make universal demands, for their purpose is no less than to reconstruct an entire international system.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ዓለም አቀፉን ሥርዓት ሙሉ በሙሉ የመቀየር ፍላጎት የረጅም ጊዜ (Long-range/Ultimate) ግብ እንጂ የመካከለኛ ጊዜ (Middle-range) ግብ አይደለም።"
                },
                {
                    q: "6. The essence of diplomacy, irrespective of its modes of conductions, remains bargaining.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ዲፕሎማሲ ምንም አይነት መልክ ቢኖረው ዋነኛ መሰረቱ ድርድር (Bargaining & Negotiation) ነው።"
                },
                {
                    q: "7. The Vienna Convention on Diplomatic Relations (1961) refers states and others as diplomatic actors.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: የ 1961ዱ የቪየና ስምምነት በሉዓላዊ መንግስታት (States only) መካከል ያለውን የዲፕሎማሲ ግንኙነት ብቻ የሚገዛ ነው።"
                },
                {
                    q: "8. The execution of foreign policy objectives and national interest of states hardly relies on its capability.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: የውጭ ፖሊሲ አፈጻጸም በዋናነት በሀገሪቱ አቅም (Capability) ላይ ጥገኛ ነው።"
                },
                {
                    q: "9. Foreign aid as a part of foreign policy instrument exclusively used for achieving political and economic objectives of the receiving states.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: የውጭ እርዳታ በዋናነት ለሰጪው አገር (Donor state) ፖለቲካዊና ኢኮኖሚያዊ ጥቅም ማስከበሪያ ሆኖ ያገለግላል።"
                },
                {
                    q: "10. Which one of the following theories refutes the existence of autarky and the pervasive role of the state?",
                    options: [
                        "A) Liberalism",
                        "B) Mercantilism",
                        "C) Marxism",
                        "D) Developmental State Approach"
                    ],
                    correct: 0,
                    exp: "A: ሊበራሊዝም የነፃ ገበያንና ዓለም አቀፍ ንግድን ይደግፋል፤ የመንግስት ከልክ ያለፈ ጣልቃ ገብነትንና ራስን ማግለልን (Autarky) በጥብቅ ይቃወማል።"
                },
                {
                    q: "11. One of the following types of foreign policy objective is considered to be as sacrosanct by the majorities of people and governments of states;",
                    options: [
                        "A) Economic development",
                        "B) Military strength",
                        "C) Democracy",
                        "D) State Survival"
                    ],
                    correct: 3,
                    exp: "D: የአገር ህልውና (State Survival / Core value) ለማንም የማይደራደሩበት ቅዱስ (Sacrosanct) ግብ ነው።"
                },
                {
                    q: "12. Russia relying on military capability in Ukraine without bringing case to international organizations is an example of:",
                    options: [
                        "A) Multilateral",
                        "B) Unilateral",
                        "C) Bilateral",
                        "D) Isolationism"
                    ],
                    correct: 1,
                    exp: "B: ሌሎች ዓለም አቀፍ ድርጅቶችን ሳያሳትፉ በራስ ውሳኔ ብቻ የሚወሰድ እርምጃ Unilateral (አንድ ወገን) ይባላል።"
                },
                {
                    q: "13. 'The Survival of China is threatened if the Survival of the Communist party is endangered' best explains:",
                    options: [
                        "A) Foreign dependency criteria",
                        "B) Partisan criteria",
                        "C) Pragmatic Criteria",
                        "D) Legal and Moral Criteria"
                    ],
                    correct: 1,
                    exp: "B: የአንድን ገዥ ፓርቲ ህልውና ከአገር ጥቅም ጋር አቆራኝቶ መተርጎም Partisan Criteria ይባላል።"
                },
                {
                    q: "14. One the following may NOT be a common describing characteristics of developmental states;",
                    options: [
                        "A) Presence of regime legitimacy emanated from economic development",
                        "B) Prioritization of political freedom than economic advancement",
                        "C) The state has privilege to determine pace of economic development",
                        "D) Strong government structures to execute development plans"
                    ],
                    correct: 1,
                    exp: "B: የልማታዊ መንግስታት መገለጫ ለኢኮኖሚ እድገት ቅድሚያ መስጠት እንጂ ለፖለቲካ ነፃነት ቅድሚያ መስጠት አይደለም።"
                },
                {
                    q: "15. Shift of ideological orientation from West to East by Colonel Mengistu Haile Mariam can be best explained by:",
                    options: [
                        "A) Pragmatic",
                        "B) Incremental",
                        "C) Synoptic",
                        "D) Partisan"
                    ],
                    correct: 2,
                    exp: "C: የተሟላና ድንገተኛ የሆነ አጠቃላይ የፖሊሲ ለውጥ (Radical/Comprehensive shift) Synoptic Approach ይባላል።"
                },
                {
                    q: "16. Economic instruments of foreign policy employed mainly for the following reasons EXCEPT:",
                    options: [
                        "A) To secure one's own national interest",
                        "B) To access market for their products",
                        "C) To safe guard the principle of equal sharing of wealth among nations",
                        "D) To put harm on potential and actual enemies"
                    ],
                    correct: 2,
                    exp: "C: የውጭ ፖሊሲ ኢኮኖሚያዊ መሳሪያዎች ለሀገራት እኩል የሀብት ክፍፍል (Equal sharing) ተብለው አይሰሩም።"
                },
                {
                    q: "17. Tariff as an instrument of foreign policy employed for all of the following purposes, BUT ONE;",
                    options: [
                        "A) To protect domestic producers from foreign competition",
                        "B) To generate revenue",
                        "C) To discourage import",
                        "D) To assist domestic producers in securing domestic market",
                        "E) To alienate the state from any kind of economic interaction"
                    ],
                    correct: 4,
                    exp: "E: ታሪፍ (ቀረጥ) ንግድን ለመቆጣጠር እንጂ አገርን ከማንኛውም የኢኮኖሚ ግንኙነት ሙሉ በሙሉ ለማግለል አያገለግልም።"
                },
                {
                    q: "18. All are promoted by Mercantilism, BUT ONE;",
                    options: [
                        "A) Free trade",
                        "B) Maximization of power",
                        "C) Strong state intervention",
                        "D) Favorable balance of trade"
                    ],
                    correct: 0,
                    exp: "A: መርካንታይሊዝም (Mercantilism) የሀገር ውስጥ ገበያን ለመጠበቅ ቀረጥ ያበዛል እንጂ ነፃ ንግድን (Free trade) አይደግፍም።"
                },
                {
                    q: "19. Why do developing countries use the multilateral approaches to address many issues of concern?",
                    options: [
                        "A) Because it dwindles their collective bargaining power",
                        "B) Because establishing multilateral relation is relatively cheaper",
                        "C) Because multilateral approaches do not demand compromises",
                        "D) None"
                    ],
                    correct: 1,
                    exp: "B: በየአገሩ ኤምባሲ ከመክፈት ይልቅ በዓለም አቀፍ መድረኮች (UN/AU) መሳተፍ አነስተኛ ወጪ ይጠይቃል (Cost-effective)።"
                },
                {
                    q: "20. A person who applies the rules of effective diplomacy may be characterized by one of the following, EXCEPT;",

        let currentExam = 'global_final';
        let currentQIndex = 0;
        let isAnswered = false;

        function switchExam(type) {
            currentExam = type;
            currentQIndex = 0;
            const titles = {
                global_final: "🌐 Global Trends Final Exam Practice",
                global_mid: "🌐 Global Trends Mid Exam Practice",
                emerging_final: "🤖 Emerging Technologies Final Exam Practice",
                emerging_mid: "🤖 Emerging Technologies Mid Exam Practice",
                history_mid: "📜 History Mid Exam Practice",
                history_final: "📜 History Final Exam Practice",
                geography_final: "🌍 Geography Final Exam Practice",
                geography_mid: "🗺️ Geography Mid Exam Practice",
                logic_final: "💡 Logic Final Exam Practice",
                logic_mid: "💡 Logic Mid Exam Practice",
                econ_final: "🎓 Economics Final Exam Practice",
                econ_mid: "📝 Economics Mid Exam Practice"
            };
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }
