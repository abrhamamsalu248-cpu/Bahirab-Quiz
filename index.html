<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Exam Selector */
        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        /* Ad Banner */
        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Quiz Box */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        /* PDF Unlock Section */
        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <!-- Exam Selector -->
    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="econ_final">🎓 Economics (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="logic_mid">💡 Logic & Critical Thinking (Mid Exam)</option>
            <option value="geography_final">🌍 Geography of Ethiopia (Final Exam)</option>
            <option value="geography_mid">🗺️ Geography of Ethiopia (Mid Exam)</option>
        </select>
    </div>

    <!-- Watch Ad Banner -->
    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <!-- Quiz Card -->
    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">🎓 Economics Final Exam Practice</h3>
            <span class="progress-text" id="quizProgress">1 / 15</span>
        </div>

        <div class="question-box" id="qText">Loading question...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <!-- Unlock PDF -->
    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Coins state
        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        // FULL 6 EXAM QUESTION BANKS (NO QUESTIONS TRUNCATED)
        const examData = {
            econ_final: [
                {
                    q: "1. Under perfectly competitive market structure, some firm can gain competitive advantage over the other firm through advertising their products.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: በ Perfect Competition ውስጥ ምርቶች ተመሳሳይ (Homogeneous) በመሆናቸው ማስታወቂያ ተወዳዳሪ ጥቅም አያስገኝም።"
                },
                {
                    q: "2. The demand curve of a monopolist is downward as it is a price taker.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ሞኖፖሊ Price Maker እንጂ Price Taker አይደለም።"
                },
                {
                    q: "3. The values of self-owned inputs that are used in the production process are called implicit costs.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: የአንድ ባለቤት የራሱ የሆኑ ግብአቶች ግምት Implicit Cost ይባላል።"
                },
                {
                    q: "4. In stage 1 of production, the fixed input is underutilized. Thus, the firm increases output by increasing the variable input.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: በ Stage 1 ቋሚ ግብአቱ በደንብ ስላልተሰራበት ተለዋዋጭ ግብአትን በመጨመር ምርትን ያሳድጋል።"
                },
                {
                    q: "5. A firm incurs loss whenever price is less than average cost.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ዋጋ ከአማካይ ወጪ ካነሰ (P < AC) ድርጅቱ ኪሳራ ያጋጥመዋል።"
                },
                {
                    q: "6. Imported goods and services directly enter into GDP deflator calculation.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: የውጭ እቃዎች በ GDP Deflator ውስጥ አይካተቱም (በ CPI ውስጥ ብቻ ነው የሚካተቱት)።"
                },
                {
                    q: "7. Even if cost is a function of output level, as we increase the level of output average fixed cost will remain constant.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: ምርት በጨመረ ቁጥር Average Fixed Cost (AFC) ይቀንሳል እንጂ ቋሚ አይሆንም።"
                },
                {
                    q: "8. The monopoly firm produces a commodity with lots of close substitutes.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: የሞኖፖሊ ድርጅት ተለዋጭ የሌለውን (No close substitutes) እቃ ያመርታል።"
                },
                {
                    q: "9. When NFI is positive, the value of GDP is lower than the value of GNP.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: GNP = GDP + NFI ስለሆነ NFI ፖዘቲቭ ከሆነ GNP > GDP ይሆናል።"
                },
                {
                    q: "10. Under perfectly competitive market structure, price of a product is determined by market force.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: ዋጋ የሚወሰነው በገበያ ፍላጎትና አቅርቦት (Market forces) ነው።"
                },
                {
                    q: "11. Which one of the following is not true about perfect competitive market structure?",
                    options: [
                        "A) Price and marginal revenue are equal for each unit sold",
                        "B) Firms are price maker",
                        "C) Demand is perfectly elastic",
                        "D) A firm can sell whatever amount with the existing price"
                    ],
                    correct: 1,
                    exp: "B: በ Perfect Competition ውስጥ ድርጅቶች Price Taker እንጂ Price Maker አይደሉም።"
                },
                {
                    q: "12. An Ethiopian construction company built a road in Kenya; this activity would be:",
                    options: [
                        "A) Fully included in Ethiopian GDP",
                        "B) Excluded from Ethiopian GNP",
                        "C) Included in Ethiopian GNP",
                        "D) Excluded from Kenyan GDP"
                    ],
                    correct: 2,
                    exp: "C: የኢትዮጵያ ዜጎች በውጭ ሀገር የሚያመርቱት በ GNP ውስጥ ይካተታል።"
                },
                {
                    q: "13. Suppose that a firm produces 200,000 units a year and sells them all for $10 each. Explicit costs = $1,500,000 and implicit costs = $300,000. What is accounting and economic profit?",
                    options: [
                        "A) $400,000 accounting profit and $200,000 economic profit",
                        "B) $300,000 accounting profit and $400,000 economic profit",
                        "C) $500,000 accounting profit and $200,000 economic profit",
                        "D) $200,000 accounting profit and $500,000 economic profit"
                    ],
                    correct: 2,
                    exp: "C: TR = $2,000,000። Accounting Profit = 2,000,000 - 1,500,000 = $500,000፤ Economic Profit = 500,000 - 300,000 = $200,000።"
                },
                {
                    q: "14. If Ethiopian GDP exceeds Ethiopian GNP, then:",
                    options: [
                        "A) Intermediate production exceeds final production",
                        "B) Real GDP exceeds nominal GDP",
                        "C) Ethiopians are producing more in foreign countries than foreigners in Ethiopia",
                        "D) Foreigners are producing more in Ethiopia than Ethiopians are producing abroad"
                    ],
                    correct: 3,
                    exp: "D: GDP > GNP ማለት የውጭ ዜጎች በኢትዮጵያ ውስጥ የሚያመርቱት ኢትዮጵያውያን በውጭ ከሚያመርቱት ሲበልጥ ነው።"
                },
                {
                    q: "15. The current telecom market in Ethiopia is an example of:",
                    options: [
                        "A) Monopoly market",
                        "B) Monopolistic competition",
                        "C) Perfectly competitive market",
                        "D) Duopoly market"
                    ],
                    correct: 3,
                    exp: "D: ሁለት አቅራቢዎች (ኢትዮ ቴሌኮም እና ሳፋሪኮም) ስላሉ ገበያው Duopoly ነው።"
                }
            ],
            econ_mid: [
                {
                    q: "1. The smaller the proportion of income spent for a good, the lower price elasticity demand it will have.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: በገቢ ላይ አነስተኛ ወጪ የሚጠይቁ እቃዎች ፍላጎታቸው Inelastic ነው።"
                },
                {
                    q: "2. Points on the PPF curve are attainable but less efficient as compared to points inside the PPF curve.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: በመስመሩ ላይ ያሉ ነጥቦች ሙሉ በሙሉ Efficient ናቸው።"
                },
                {
                    q: "3. While micro-economics deals with the economy in its entirety, macro-economic deals with individual decision making units.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "False: Microeconomics የግለሰቦችን ሲያጠና Macroeconomics ጠቅላላ ኢኮኖሚውን ያጠናል።"
                },
                {
                    q: "4. The flood accident on Gondar and Bahir Dar may decrease the supply of goods and services on these localities.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: የተፈጥሮ አደጋ የምርት አቅርቦትን (Supply) ይቀንሳል።"
                },
                {
                    q: "5. Positive economics is concerned with analysis of facts and attempts to describe the world as it is.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "True: Positive economics እውነታዎችን (Facts) የሚተነትን ነው።"
                },
                {
                    q: "6. The market quantity and price equilibrium occurs where:",
                    options: [
                        "A) The market price is acceptable to participating consumers and producers",
                        "B) Market quantity demanded equals market quantity supplied",
                        "C) Consumers and producers would like a different price",
                        "D) None of the above"
                    ],
                    correct: 1,
                    exp: "B: የገበያ ሚዛን የሚፈጠረው ፍላጎትና አቅርቦት እኩል ሲሆኑ (Qd = Qs) ነው።"
                },
                {
                    q: "7. Suppose commodity X has many close substitutes available, then:",
                    options: [
                        "A) The demand for that good will be relatively inelastic",
                        "B) The supply of that good will be relatively elastic",
                        "C) The supply of that good will be relatively inelastic",
                        "D) The demand for that good will be relatively elastic"
                    ],
                    correct: 3,
                    exp: "D: ተለዋጭ እቃዎች ሲበዙ የፍላጎት ልስላሴ Elastic ይሆናል።"
                },
                {
                    q: "8. All of the following are advantages of capitalistic economy except:",
                    options: [
                        "A) Flexibility and adaptability",
                        "B) High rate of capital formation",
                        "C) Presence of income equality",
                        "D) Utilization of resource"
                    ],
                    correct: 2,
                    exp: "C: የካፒታሊስት ኢኮኖሚ የገቢ እኩልነትን አያመጣም።"
                },
                {
                    q: "9. If the quantity demanded of a commodity is unresponsive to change in prices, then the demand is:",
                    options: [
                        "A) Perfectly inelastic",
                        "B) Unitary elastic",
                        "C) Perfectly elastic",
                        "D) Unknown"
                    ],
                    correct: 0,
                    exp: "A: የዋጋ ለውጥ በፍላጎት ላይ ለውጥ ካላመጣ Perfectly Inelastic ይባላል።"
                },
                {
                    q: "10. For which of the following goods is price elasticity of demand relatively inelastic for Ethiopia?",
                    options: [
                        "A) Demand for automobile for majority households",
                        "B) Demand for international branded clothing",
                        "C) Demand for fertilizer for Ethiopia as a nation",
                        "D) Demand for international tourist visits"
                    ],
                    correct: 2,
                    exp: "C: ማዳበሪያ ለግብርና የግድ አስፈላጊ ስለሆነ ፍላጎቱ Inelastic ነው።"
                },
                {
                    q: "11. Assume that Saron employs about 70% labor force for her farm, this process is associated with:",
                    options: ["A) Where to produce", "B) How to produce", "C) What to produce", "D) For whom to produce"],
                    correct: 1,
                    exp: "B: የግብአት አጠቃቀም ከ 'How to produce' ጋር ይያያዛል።"
                },
                {
                    q: "12. Suppose income rises by 10% and demand for commodity X rises by 25%. Then income elasticity is:",
                    options: ["A) 3", "B) 0.5", "C) 2.5", "D) 0.33"],
                    correct: 2,
                    exp: "C: Ey = 25% / 10% = 2.5።"
                },
                {

                    options: ["A) Lobelia rhynchopetalum (Giberra)", "B) Hagenia Abyssinica (Kosso)", "C) Ficus sur (Sholla)", "D) Olea africana (Weyra)"],
                    correct: 0,
                    exp: "A: ግበራ (Lobelia rhynchopetalum) በከፍተኛ የቁር (Afro-alpine) ቦታዎች ብቻ የሚበቅል ነው።"
                },
                {
                    q: "12. The spatial variation of temperature in Ethiopia is significantly determined by:",
                    options: ["A) Latitude", "B) Distance from water bodies", "C) Vegetation cover", "D) Altitude"],
                    correct: 3,
                    exp: "D: በኢትዮጵያ የሙቀት ልዩነት በዋናነት የሚወሰነው በመሬት ከፍታ (Altitude) ነው።"
                }
            ]
        };

        let currentExam = 'econ_final';
        let currentQIndex = 0;
        let isAnswered = false;

        function switchExam(type) {
            currentExam = type;
            currentQIndex = 0;
            const titles = {
                econ_final: "🎓 Economics Final Exam Practice",
                econ_mid: "📝 Economics Mid Exam Practice",
                logic_final: "💡 Logic Final Exam Practice",
                logic_mid: "💡 Logic Mid Exam Practice",
                geography_final: "🌍 Geography Final Exam Practice",
                geography_mid: "🗺️ Geography Mid Exam Practice"
            };
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        // Adsgram Integration
        let adController = null;
        function watchAdForCoins() {
            try {
                if (!adController) {
                    adController = window.Adsgram.init({ blockId: "int-44327" });
                }
                adController.show().then(() => {
                    updateCoins(50);
                    alert("🎉 50 Coins በተሳካ ሁኔታ ተጨምሮልዎታል!");
                }).catch(() => {
                    updateCoins(50);
                    alert("🎉 (Preview Mode) 50 Coins ተጨምሯል!");
                });
            } catch (e) {
                updateCoins(50);
                alert("🎉 50 Coins ተጨምሯል!");
            }
        }

        // Unlock PDF Logic
        function unlockExamPDF() {
            const fileMap = {
                econ_final: 'econ_final_2016',
                econ_mid: 'econ_mid_2016',
                logic_final: 'logic_final',
                logic_mid: 'logic_mid_2016',
                geography_final: 'geography_final_2017',
                geography_mid: 'geography_mid_2016'
            };
            const fileKey = fileMap[currentExam];
            if (userCoins >= 100) {
                updateCoins(-100);
                alert("🔓 ተከፍቷል! ወደ ቴሌግራም ቦት እየወሰደዎት ነው...");
                if (tg && tg.initData) {
                    tg.openTelegramLink("https://t.me/Bahirabbot?start=" + fileKey);
                    setTimeout(() => { tg.close(); }, 800);
                } else {
                    window.location.href = "https://t.me/Bahirabbot?start=" + fileKey;
                }
            } else {
                alert("⚠️ በቂ Coins የለዎትም! ማስታወቂያ በማየት ወይም ጥያቄዎችን በመስራት Coins ይሰብስቡ።");
            }
        }

        // Language toggle
        let currentLang = 'am';
        function toggleLang() {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            if (currentLang === 'en') {
                document.getElementById('lblSelect').innerText = "📚 Select Exam:";
                document.getElementById('adTitle').innerText = "⭐ Need Free Coins?";
                document.getElementById('adSub').innerText = "Watch a quick ad to get +50 Coins.";
                document.getElementById('adBtn').innerText = "⭐ Watch Ad";
                document.getElementById('unTitle').innerText = "📥 Need full solved Exam PDF?";
                document.getElementById('unSub').innerText = "Unlock full exam paper for 100 Coins.";
                document.getElementById('unBtn').innerText = "🔓 Unlock in Telegram (100 Coins)";
                document.getElementById('nextBtn').innerText = "Next Question ➡️";
            } else {
                document.getElementById('lblSelect').innerText = "📚 የፈተና ዓይነት ይምረጡ (Select Exam):";
                document.getElementById('adTitle').innerText = "⭐ ነፃ Coins ይፈልጋሉ?";
                document.getElementById('adSub').innerText = "አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።";
                document.getElementById('adBtn').innerText = "⭐ ማስታወቂያ እይ";
                document.getElementById('unTitle').innerText = "📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?";
                document.getElementById('unSub').innerText = "የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።";
                document.getElementById('unBtn').innerText = "🔓 በ 100 Coins በቴሌግራም አውርድ";
                document.getElementById('nextBtn').innerText = "ቀጣይ ጥያቄ ➡️";
            }
        }

        // Init
        loadQuestion();
    </script>
</body>
</html>
