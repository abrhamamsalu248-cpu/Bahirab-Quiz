<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- External Question Banks -->
    <script src="economics.js"></script>
    <script src="logic.js"></script>
    <script src="geography.js"></script>
    <script src="history.js"></script>
    <script src="emerging.js"></script>
    <script src="global.js"></script>
    <script src="civics.js"></script>
    <script src="anthropology.js"></script>
    <script src="english.js"></script>
    <script src="psychology.js"></script>

    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
            white-space: pre-line;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="psychology_final">🧠 General Psychology (Final Exam)</option>
            <option value="english_final">📖 Communicative English Skills II (Final Exam)</option>
            <option value="english_mid">📖 Communicative English Skills II (Mid Exam)</option>
            <option value="anthro_final">🏺 Social Anthropology (Final Exam)</option>
            <option value="anthro_mid">🏺 Social Anthropology (Mid Exam)</option>
            <option value="civics_final">⚖️ Moral & Civic Education (Final Exam)</option>
            <option value="civics_mid">⚖️ Moral & Civic Education (Mid Exam)</option>
            <option value="global_final">🌐 Global Trends (Final Exam)</option>
            <option value="global_mid">🌐 Global Trends (Mid Exam)</option>
            <option value="emerging_final">🤖 Emerging Technologies (Final Exam)</option>
            <option value="emerging_mid">🤖 Emerging Technologies (Mid Exam)</option>
            <option value="history_final">📜 History of Ethiopia (Final Exam)</option>
            <option value="history_mid">📜 History of Ethiopia (Mid Exam)</option>
            <option value="geography_final">🌍 Geography of Ethiopia (Final Exam)</option>
            <option value="geography_mid">🗺️ Geography of Ethiopia (Mid Exam)</option>
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="logic_mid">💡 Logic & Critical Thinking (Mid Exam)</option>
            <option value="econ_final">🎓 Economics (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
        </select>
    </div>

    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">🧠 General Psychology Final Exam</h3>
            <span class="progress-text" id="quizProgress">1 / 32</span>
        </div>

        <div class="question-box" id="qText">ጥያቄዎች በመጫን ላይ ናቸው...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        let examData = {};

        function getMergedData() {
            return {
                ...(window.psychologyData || {}),
                ...(window.englishData || {}),
                ...(window.anthropologyData || {}),
                ...(window.civicsData || {}),
                ...(window.economicsData || {}),
                ...(window.logicData || {}),
                ...(window.geographyData || {}),
                ...(window.historyData || {}),
                ...(window.emergingData || {}),
                ...(window.globalData || {})
            };
        }

        const titles = {
            psychology_final: "🧠 General Psychology Final Exam",
            english_final: "📖 Communicative English Skills II Final Exam",
            english_mid: "📖 Communicative English Skills II Mid Exam",
            anthro_final: "🏺 Social Anthropology Final Exam Practice",
            anthro_mid: "🏺 Social Anthropology Mid Exam Practice",
            civics_final: "⚖️ Civic Education Final Exam Practice",
            civics_mid: "⚖️ Civic Education Mid Exam Practice",
            global_final: "🌐 Global Trends Final Exam Practice",
            global_mid: "🌐 Global Trends Mid Exam Practice",
            emerging_final: "🤖 Emerging Technologies Final Exam Practice",
            emerging_mid: "🤖 Emerging Technologies Mid Exam Practice",
            history_final: "📜 History of Ethiopia Final Exam Practice",
            history_mid: "📜 History of Ethiopia Mid Exam Practice",
            geography_final: "🌍 Geography Final Exam Practice",
            geography_mid: "🗺️ Geography of Ethiopia Mid Exam Practice",
            logic_final: "💡 Logic Final Exam Practice",
            logic_mid: "💡 Logic Mid Exam Practice",
            econ_final: "🎓 Economics Final Exam Practice",
            econ_mid: "📝 Economics Mid Exam Practice"
        };

        let currentExam = 'psychology_final';
        let currentQIndex = 0;
        let isAnswered = false;

        function switchExam(type) {
            currentExam = type;
            currentQIndex = 0;
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            examData = getMergedData();
            isAnswered = false;
            const qList = examData[currentExam] || [];
            
            if (!qList.length) {
                setTimeout(loadQuestion, 150);
                return;
            }

            const current = qList[currentQIndex];
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        let adController = null;
        function watchAdForCoins() {
            try {
                if (!adController) {
                    adController = window.Adsgram.init({ blockId: "int-44327" });
                }
                adController.show().then(() => {
                    updateCoins(50);
                    alert("🎉 50 Coins በተሳካ ሁኔታ ተጨምሮልዎታል!");
                }).catch(() => {
                    updateCoins(50);
                    alert("🎉 (Preview Mode) 50 Coins ተጨምሯል!");
                });
            } catch (e) {
                updateCoins(50);
                alert("🎉 50 Coins ተጨምሯል!");
            }
        }

        function unlockExamPDF() {
            const fileMap = {
                psychology_final: 'psychology_final_2016',
                english_final: 'english_final_2016',
                english_mid: 'english_mid_2016',
                anthro_final: 'anthro_final_2016',
                anthro_mid: 'anthro_mid_2016',
                civics_final: 'civics_final_2015',
                civics_mid: 'civics_mid_2016',
                global_final: 'global_final_2016',
                global_mid: 'global_mid_2016',
                emerging_final: 'emerging_final_2016',
                emerging_mid: 'emerging_mid_2016',
                history_final: 'history_final_2016',
                history_mid: 'history_mid_2016',
                geography_final: 'geography_final_2017',
                geography_mid: 'geography_mid_2016',
                logic_final: 'logic_final',
                logic_mid: 'logic_mid_2016',
                econ_final: 'econ_final_2016',
                econ_mid: 'econ_mid_2016'
            };
            const fileKey = fileMap[currentExam];
            if (userCoins >= 100) {
                updateCoins(-100);
                alert("🔓 ተከፍቷል! ወደ ቴሌግራም ቦት እየወሰደዎት ነው...");
                if (tg && tg.initData) {
                    tg.openTelegramLink("https://t.me/Bahirabbot?start=" + fileKey);
                    setTimeout(() => { tg.close(); }, 800);
                } else {
                    window.location.href = "https://t.me/Bahirabbot?start=" + fileKey;
                }
            } else {
                alert("⚠️ በቂ Coins የለዎትም! ማስታወቂያ በማየት ወይም ጥያቄዎችን በመስራት Coins ይሰብስቡ።");
            }
        }

        let currentLang = 'am';
        function toggleLang() {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            if (currentLang === 'en') {
                document.getElementById('lblSelect').innerText = "📚 Select Exam:";
                document.getElementById('adTitle').innerText = "⭐ Need Free Coins?";
                document.getElementById('adSub').innerText = "Watch a quick ad to get +50 Coins.";
                document.getElementById('adBtn').innerText = "⭐ Watch Ad";
                document.getElementById('unTitle').innerText = "📥 Need full solved Exam PDF?";
                document.getElementById('unSub').innerText = "Unlock full exam paper for 100 Coins.";
                document.getElementById('unBtn').innerText = "🔓 Unlock in Telegram (100 Coins)";
                document.getElementById('nextBtn').innerText = "Next Question ➡️";
            } else {
                document.getElementById('lblSelect').innerText = "📚 የፈተና ዓይነት ይምረጡ (Select Exam):";
                document.getElementById('adTitle').innerText = "⭐ ነፃ Coins ይፈልጋሉ?";
                document.getElementById('adSub').innerText = "አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።";
                document.getElementById('adBtn').innerText = "⭐ ማስታወቂያ እይ";
                document.getElementById('unTitle').innerText = "📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?";
                document.getElementById('unSub').innerText = "የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።";
                document.getElementById('unBtn').innerText = "🔓 በ 100 Coins በቴሌግራም አውርድ";
                document.getElementById('nextBtn').innerText = "ቀጣይ ጥያቄ ➡️";
            }
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
