    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
            text-align: left;
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Tabs Nav */
        .tabs-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            background: #e2e8f0;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Home View (Grid Buttons) */
        .home-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            text-align: center;
        }
        .course-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .course-btn {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .course-btn span { font-size: 24px; }
        .course-btn:active { transform: scale(0.97); background: #f0fdf4; border-color: var(--success); }

        /* Materials Main View (Category Buttons) */
        #materialsMainView {
            display: block;
        }
        /* Materials Detail View (Items List) */
        #materialsDetailView {
            display: none;
            text-align: left;
        }

        .mat-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }
        .mat-card h3 { margin: 0 0 4px 0; font-size: 14px; color: #111; }
        .mat-card p { color: var(--text-sub); font-size: 11px; margin-bottom: 8px; }
        .btn-mat {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
            font-weight: bold;
        }

        /* Quiz View */
        #quizView {
            display: none;
        }
        .back-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-back {
            background: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
            white-space: pre-line;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }

</head>

        function renderMatCategories() {
            const grid = document.getElementById('matCategoriesGrid');
            grid.innerHTML = '';
            categorizedMaterials.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'course-btn';
                btn.innerHTML = `<span>${cat.name.split(' ')[0]}</span>${cat.name.substring(2)}`;
                btn.onclick = () => openMatCategory(cat.id);
                grid.appendChild(btn);
            });
        }

        function openMatCategory(catId) {
            const category = categorizedMaterials.find(c => c.id === catId);
            if (!category) return;

            document.getElementById('materialsMainView').style.display = 'none';
            document.getElementById('materialsDetailView').style.display = 'block';
            document.getElementById('detailCatTitle').innerText = category.name;

            const listEl = document.getElementById('matItemsList');
            listEl.innerHTML = '';
            category.items.enter(item => {}); // placeholder safe
            category.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'mat-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                    <button class="btn-mat" onclick="unlockMaterial('${item.key}')">🔓 በ 100 Coins አውርድ (ወይም ማስታወቂያ)</button>
                `;
                listEl.appendChild(card);
            });
        }

            document.getElementById('tabQuiz').classList.remove('active');
            document.getElementById('tabMats').classList.remove('active');
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('materialsView').style.display = 'none';
            document.getElementById('quizView').style.display = 'none';

            if (tab === 'quiz') {
                document.getElementById('tabQuiz').classList.add('active');
                document.getElementById('homeView').style.display = 'block';
            } else if (tab === 'mats') {
                document.getElementById('tabMats').classList.add('active');
                document.getElementById('materialsView').style.display = 'block';
                backToMatMain();
                renderMatCategories();
            }
        }

        function openExam(type) {
            currentExam = type;
            currentQIndex = 0;
            document.getElementById('mainTabs').style.display = 'none';
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('quizView').style.display = 'block';
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function goHome() {
            document.getElementById('quizView').style.display = 'none';
            document.getElementById('mainTabs').style.display = 'flex';
            document.getElementById('homeView').style.display = 'block';
        }

        function loadQuestion() {
            examData = getMergedData();
            isAnswered = false;
            const qList = examData[currentExam] || [];
            
            if (!qList.length) {
                setTimeout(loadQuestion, 150);
                return;
            }

            const current = qList[currentQIndex];
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';

                document.getElementById('nextBtn').style.display = 'none';
            }
        }
