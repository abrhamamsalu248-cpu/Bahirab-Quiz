<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahirab Quiz & Study Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            --coin: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        .coin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            color: var(--coin);
        }

        .lang-switch {
            background: #e0f2fe;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Course / Exam Selector */
        .select-box {
            margin-bottom: 12px;
        }
        .select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .exam-dropdown {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--primary);
            background: #ffffff;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }

        /* Ad Banner */
        .earn-banner {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .earn-banner div h4 { margin: 0 0 2px 0; font-size: 14px; }
        .earn-banner div p { margin: 0; font-size: 11px; opacity: 0.9; }
        .btn-earn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Quiz Box */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .card-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
        }
        .progress-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }

        .question-box {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 14px;
            color: #111827;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

        .explanation {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #166534;
            margin-top: 10px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        /* PDF Unlock Section */
        .unlock-card {
            background: #ffffff;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .unlock-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--primary); }
        .unlock-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-sub); }
        .btn-unlock {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="coin-box">
            🪙 <span id="coinCount">50</span> Coins
        </div>
        <button class="lang-switch" onclick="toggleLang()">🌐 Amh / Eng</button>
    </div>

    <!-- Exam Selector -->
    <div class="select-box">
        <label id="lblSelect">📚 የፈተና ዓይነት ይምረጡ (Select Exam):</label>
        <select class="exam-dropdown" id="examSelect" onchange="switchExam(this.value)">
            <option value="logic_final">💡 Logic & Critical Thinking (Final Exam)</option>
            <option value="econ_mid">📝 Economics (Mid Exam)</option>
            <option value="econ_final">🎓 Economics (Final Exam)</option>
        </select>
    </div>

    <!-- Watch Ad Banner -->
    <div class="earn-banner">
        <div>
            <h4 id="adTitle">⭐ ነፃ Coins ይፈልጋሉ?</h4>
            <p id="adSub">አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።</p>
        </div>
        <button class="btn-earn" id="adBtn" onclick="watchAdForCoins()">⭐ ማስታወቂያ እይ</button>
    </div>

    <!-- Quiz Card -->
    <div class="card">
        <div class="card-header">
            <h3 id="quizTitle">💡 Logic Final Exam Practice</h3>
            <span class="progress-text" id="quizProgress">1 / 15</span>
        </div>

        <div class="question-box" id="qText">Loading question...</div>
        <div id="optionsContainer"></div>

        <div class="explanation" id="expBox"></div>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">ቀጣይ ጥያቄ ➡️</button>
    </div>

    <!-- Unlock PDF -->
    <div class="unlock-card">
        <h4 id="unTitle">📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?</h4>
        <p id="unSub">የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።</p>
        <button class="btn-unlock" id="unBtn" onclick="unlockExamPDF()">🔓 በ 100 Coins በቴሌግራም አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Coins state
        let userCoins = parseInt(localStorage.getItem('bahirab_coins')) || 50;
        document.getElementById('coinCount').innerText = userCoins;

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('bahirab_coins', userCoins);
            document.getElementById('coinCount').innerText = userCoins;
        }

        // Comprehensive Question Banks
        const examData = {
            logic_final: [
                {
                    q: "1. A word is vague when there is no clear borderline case for it to be or not to be applied to a particular case.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! Vagueness የሚፈጠረው አንድ ቃል የሚተገበርበት ወይም የማይተገበርበት ወሰን (Borderline) ግልጽ ሳይሆን ሲቀር ነው።"
                },
                {
                    q: "2. All words have an intensional meaning and an extensional meaning.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! ሁሉም ቃላት Extensional Meaning የላቸውም (ለምሳሌ፦ 'unicorn' ወይም 'dinosaur' በገሃዱ ዓለም ህልውና የላቸውም)።"
                },
                {
                    q: "3. The indirect approach of appeal to the people fallacy is common in advertising industry.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! ማስታወቂያዎች የሰዎችን የዝነኝነት፣ የውበት ወይም የመጠቃለል ስሜት በመጠቀም Appeal to the People (Indirect) ይጠቀማሉ።"
                },
                {
                    q: "4. Straw man fallacy is committed when the arguer cites the claims of another person who lacks the required expertise.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! ባለሙያ ያልሆነን ሰው ጠቅሶ መከራከር Appeal to Unqualified Authority እንጂ Straw Man አይደለም።"
                },
                {
                    q: "5. False dichotomy always involves an 'either... or...' statement, at least implicitly.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! False Dichotomy ሁለት የማይገናኙ ጽንፎችን 'ወይ ይሄ... ወይ ያ...' በማለት ያቀርባል።"
                },
                {
                    q: "6. Which of the following best expresses the form of 'ad hominem tu quoque' fallacy?",
                    options: [
                        "A) X failed to follow his/her own advice. Therefore, X's claim should be rejected.",
                        "B) X is biased or has a questionable motive. Therefore, X's claim should be rejected.",
                        "C) X is a bad person; therefore, X's claim must be rejected.",
                        "D) X's view is false or unjustified."
                    ],
                    correct: 0,
                    exp: "ትክክል! Tu quoque ማለት 'አንተም እኮ አታደርገውም (You too / hypocrite)' በሚል ምክሩን ውድቅ ማድረግ ነው።"
                },
                {
                    q: "7. 'Each cell in the human body is invisible. Therefore, the human body itself is invisible.' This fallacy is:",
                    options: [
                        "A) Fallacy of Composition",
                        "B) Fallacy of Division",
                        "C) Amphiboly",
                        "D) Accident"
                    ],
                    correct: 0,
                    exp: "ትክክል! የክፍሉን (Cell) ባህሪ ወደ ሙሉው አካል (Whole body) ማስተላለፍ Fallacy of Composition ይባላል።"
                },
                {
                    q: "8. Which type of definition is common especially in the area of science and philosophy?",
                    options: [
                        "A) Persuasive definition",
                        "B) Précising definition",
                        "C) Lexical definition",
                        "D) Theoretical definition"
                    ],
                    correct: 3,
                    exp: "ትክክል! የሳይንስ እና ፍልስፍና ጽንሰ-ሀሳቦችን በንድፈ-ሀሳብ ለመግለጽ Theoretical Definition ጥቅም ላይ ይውላል።"
                },
                {
                    q: "9. The view that 'my wife is not clever, therefore all wives are not clever' commits:",
                    options: [
                        "A) Begging the question",
                        "B) Ad hominem abusive",
                        "C) Composition",
                        "D) Hasty generalization"
                    ],
                    correct: 3,
                    exp: "ትክክል! ከአንድ ወይም ጥቂት ምሳሌ ተነስቶ ወደ አጠቃላይ ድምዳሜ መድረስ Hasty Generalization ይባላል።"
                },
                {
                    q: "10. A fallacy that employs threats or intimidation is:",
                    options: [
                        "A) Straw man",
                        "B) Appeal to force (Argumentum ad Baculum)",
                        "C) Appeal to pity",
                        "D) Suppressed evidence"
                    ],
                    correct: 1,
                    exp: "ትክክል! በማስፈራራት ወይም በሀይል ማስገደድ የሚፈጸም ክርክር Appeal to Force ይባላል።"
                },
                {
                    q: "11. 'Senior citizen means a purchaser must be at least 65 years old.' How should this definition be classified?",
                    options: [
                        "A) Stipulative Definition",
                        "B) Précising Definition",
                        "C) Lexical Definition",
                        "D) Persuasive Definition"
                    ],
                    correct: 1,
                    exp: "ትክክል! አንድን አሻሚ ቃል ግልጽ ወሰን ለማበጀት (ለምሳሌ 65 ዓመት) የሚሰጥ ትርጉም Précising Definition ነው።"
                },
                {
                    q: "12. 'London, Paris, Madrid' for the term 'City' represents which method of definition?",
                    options: [
                        "A) Enumerative definition",
                        "B) Definition by subclass",
                        "C) Etymological definition",
                        "D) Operational definition"
                    ],
                    correct: 0,
                    exp: "ትክክል! አባላቱን በስማቸው በዝርዝር በመጥቀስ ማብራራት Enumerative Definition ይባላል።"
                },
                {
                    q: "13. 'Whatever you do, never buy a lottery ticket. If you do, you'll be betting on soccer, then poker, and end up totally broke.' commits:",
                    options: [
                        "A) Missing the point",
                        "B) Post hoc",
                        "C) Slippery slope",
                        "D) Begging the question"
                    ],
                    correct: 2,
                    exp: "ትክክል! ከአንድ ትንሽ ነገር ተነስቶ ያለምክንያት ወደ አስከፊ ሰንሰለታማ ውጤት የሚወስድ ክርክር Slippery Slope ነው።"
                },
                {
                    q: "14. 'Have you given up your criminal ways?' If answered 'yes', it commits:",
                    options: [
                        "A) Complex question",
                        "B) False cause",
                        "C) Suppressed evidence",
                        "D) Appeal to pity"
                    ],
                    correct: 0,
                    exp: "ትክክል! ሁለት ያደፈጡ ጥያቄዎችን አጣምሮ በማቅረብ ወጥመድ ውስጥ የሚከት ጥያቄ Complex Question ነው።"
                },
                {
                    q: "15. A fallacy that occurs when premises support one conclusion, but then a different conclusion is drawn:",
                    options: [
                        "A) Missing the point (Ignoratio Elenchi)",
                        "B) Slippery slope",
                        "C) Complex question",
                        "D) Weak analogy"
                    ],
                    correct: 0,
                    exp: "ትክክል! መረጃው ወደ አንድ ግልጽ ድምዳሜ እያመራ ተከራካሪው ሌላ ያልተገናኘ ድምዳሜ ላይ ሲደርስ Missing the point ይባላል።"
                }
            ],
            econ_mid: [
                {
                    q: "1. The smaller the proportion of income spent for a good, the lower price elasticity demand it will have.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! በአንድ እቃ ላይ የሚወጣው የገቢ መጠን አነስተኛ ሲሆን የዋጋ ለውጥ በፍላጎቱ ላይ የሚያሳድረው ተጽዕኖ ዝቅተኛ (Inelastic) ይሆናል።"
                },
                {
                    q: "2. Points on the PPF curve are attainable but less efficient as compared to points inside the PPF curve.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! በ PPF መስመር ላይ ያሉ ነጥቦች ሙሉ በሙሉ ውጤታማ (Efficient) ናቸው።"
                },
                {
                    q: "3. The market quantity and price equilibrium occurs where:",
                    options: [
                        "A) The market price is acceptable to participating consumers and producers",
                        "B) Market quantity demanded equals market quantity supplied",
                        "C) Consumers and producers would like a different price",
                        "D) None of the above"
                    ],
                    correct: 1,
                    exp: "ትክክል! Equilibrium የሚፈጠረው ፍላጎትና አቅርቦት እኩል ሲሆኑ (Qd = Qs) ነው።"
                },
                {
                    q: "4. All of the following are advantages of capitalistic economy except:",
                    options: [
                        "A) Flexibility and adaptability",
                        "B) High rate of capital formation",
                        "C) Presence of income equality",
                        "D) Utilization of resource"
                    ],
                    correct: 2,
                    exp: "ትክክል! የካፒታሊስት ኢኮኖሚ የገቢ ልዩነትን (Income Inequality) እንጂ እኩልነትን አያመጣም።"
                },
                {
                    q: "5. Suppose income rises by 10% and demand for commodity X rises by 25%. Then income elasticity (Ey) is:",
                    options: ["A) 3", "B) 0.5", "C) 2.5", "D) 0.33"],
                    correct: 2,
                    exp: "ትክክል! Ey = %ΔQd / %ΔY = 25% / 10% = 2.5።"
                }
            ],
            econ_final: [
                {
                    q: "1. Under perfectly competitive market, some firm can gain competitive advantage through advertising.",
                    options: ["A) True", "B) False"],
                    correct: 1,
                    exp: "ትክክል! በ Perfect Competition ውስጥ ምርቶች ተመሳሳይ (Homogeneous) በመሆናቸው ማስታወቂያ ተወዳዳሪ ጥቅም አያስገኝም።"
                },
                {
                    q: "2. The values of self-owned inputs used in production are called implicit costs.",
                    options: ["A) True", "B) False"],
                    correct: 0,
                    exp: "ትክክል! የአንድ ባለቤት የራሱ የሆኑ ግብአቶች ዋጋ Implicit Cost ይባላል።"
                },
                {
                    q: "3. An Ethiopian construction company built a road in Kenya; this is:",
                    options: [
                        "A) Included in Ethiopian GDP",
                        "B) Excluded from Ethiopian GNP",
                        "C) Included in Ethiopian GNP",
                        "D) Excluded from Kenyan GDP"
                    ],
                    correct: 2,
                    exp: "ትክክል! የዜጎች የውጭ ሀገር ምርት በ GNP ውስጥ ይካተታል።"
                },
                {
                    q: "4. Produces 200,000 units at $10 each. Explicit cost = $1,500,000, Implicit = $300,000. Profit is:",
                    options: [
                        "A) $400k accounting & $200k economic",
                        "B) $300k accounting & $400k economic",
                        "C) $500k accounting & $200k economic",
                        "D) $200k accounting & $500k economic"
                    ],
                    correct: 2,
                    exp: "ትክክል! TR = $2,000,000። Accounting Profit = $500,000፤ Economic Profit = $200,000።"
                },
                {
                    q: "5. The current telecom market in Ethiopia is an example of:",
                    options: [
                        "A) Monopoly market",
                        "B) Monopolistic competition",
                        "C) Perfectly competitive market",
                        "D) Duopoly market"
                    ],
                    correct: 3,
                    exp: "ትክክል! ሁለት አቅራቢዎች ስላሉ ገበያው Duopoly ነው።"
                }
            ]
        };

        let currentExam = 'logic_final';
        let currentQIndex = 0;
        let isAnswered = false;

        function switchExam(type) {
            currentExam = type;
            currentQIndex = 0;
            const titles = {
                logic_final: "💡 Logic Final Exam Practice",
                econ_mid: "📝 Economics Mid Exam Practice",
                econ_final: "🎓 Economics Final Exam Practice"
            };
            document.getElementById('quizTitle').innerText = titles[type];
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            
            document.getElementById('quizProgress').innerText = `${currentQIndex + 1} / ${qList.length}`;
            document.getElementById('qText').innerText = current.q;
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelect(idx, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('expBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleSelect(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qList = examData[currentExam];
            const current = qList[currentQIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIdx === current.correct) {
                btnElement.classList.add('correct');
                updateCoins(20);
                document.getElementById('expBox').innerText = `🎉 ትክክል! (+20 Coins)\n💡 ${current.exp}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns[current.correct].classList.add('correct');
                document.getElementById('expBox').innerText = `❌ ተሳስተዋል!\n💡 ${current.exp}`;
            }

            document.getElementById('expBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            const qList = examData[currentExam];
            currentQIndex++;
            if (currentQIndex < qList.length) {
                loadQuestion();
            } else {
                document.getElementById('qText').innerText = "🎉 እንኳን ደስ አለዎት! የዚህን ፈተና ጥያቄዎች ሰርተው አጠናቀዋል።";
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('expBox').innerText = `ያሎት አጠቃላይ ነጥብ፡ 🪙 ${userCoins} Coins ነው።`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        // Adsgram Integration
        let adController = null;
        function watchAdForCoins() {
            try {
                if (!adController) {
                    adController = window.Adsgram.init({ blockId: "int-44327" });
                }
                adController.show().then(() => {
                    updateCoins(50);
                    alert("🎉 50 Coins በተሳካ ሁኔታ ተጨምሮልዎታል!");
                }).catch(() => {
                    updateCoins(50);
                    alert("🎉 (Preview Mode) 50 Coins ተጨምሯል!");
                });
            } catch (e) {
                updateCoins(50);
                alert("🎉 50 Coins ተጨምሯል!");
            }
        }

        // Unlock PDF Logic
        function unlockExamPDF() {
            const fileMap = {
                logic_final: 'logic_final',
                econ_mid: 'econ_mid_2016',
                econ_final: 'econ_final_2016'
            };
            const fileKey = fileMap[currentExam];
            if (userCoins >= 100) {
                updateCoins(-100);
                alert("🔓 ተከፍቷል! ወደ ቴሌግራም ቦት እየወሰደዎት ነው...");
                if (tg && tg.initData) {
                    tg.openTelegramLink("https://t.me/Bahirabbot?start=" + fileKey);
                    setTimeout(() => { tg.close(); }, 800);
                } else {
                    window.location.href = "https://t.me/Bahirabbot?start=" + fileKey;
                }
            } else {
                alert("⚠️ በቂ Coins የለዎትም! ማስታወቂያ በማየት ወይም ጥያቄዎችን በመስራት Coins ይሰብስቡ።");
            }
        }

        // Language toggle
        let currentLang = 'am';
        function toggleLang() {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            if (currentLang === 'en') {
                document.getElementById('lblSelect').innerText = "📚 Select Exam:";
                document.getElementById('adTitle').innerText = "⭐ Need Free Coins?";
                document.getElementById('adSub').innerText = "Watch a quick ad to get +50 Coins.";
                document.getElementById('adBtn').innerText = "⭐ Watch Ad";
                document.getElementById('unTitle').innerText = "📥 Need full solved Exam PDF?";
                document.getElementById('unSub').innerText = "Unlock full exam paper for 100 Coins.";
                document.getElementById('unBtn').innerText = "🔓 Unlock in Telegram (100 Coins)";
                document.getElementById('nextBtn').innerText = "Next Question ➡️";
            } else {
                document.getElementById('lblSelect').innerText = "📚 የፈተና ዓይነት ይምረጡ (Select Exam):";
                document.getElementById('adTitle').innerText = "⭐ ነፃ Coins ይፈልጋሉ?";
                document.getElementById('adSub').innerText = "አጭር ማስታወቂያ በማየት +50 Coins ያግኙ።";
                document.getElementById('adBtn').innerText = "⭐ ማስታወቂያ እይ";
                document.getElementById('unTitle').innerText = "📥 ሙሉውን የተፈታ የፈተና PDF ይፈልጋሉ?";
                document.getElementById('unSub').innerText = "የተሟላውን የፈተና ፒዲኤፍ እና ማብራሪያ በ 100 Coins አውርድ።";
                document.getElementById('unBtn').innerText = "🔓 በ 100 Coins በቴሌግራም አውርድ";
                document.getElementById('nextBtn').innerText = "ቀጣይ ጥያቄ ➡️";
            }
        }

        // Init
        loadQuestion();
    </script>
